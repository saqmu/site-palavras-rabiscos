<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Palavras & Rabiscos | Experience</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="custom-cursor"></div>

    <nav>
        <a href="#home">Home</a>
        <a href="#sobre">Sobre</a>
        <a href="#portfolio">Portfólio</a>
        <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
    </nav>

    <section id="home" class="bubble-wrap">
        <div class="soap-bubble" id="mainBubble">
            <img src="logo.png" alt="Logo">
        </div>
    </section>

    <main class="grid">
        <div class="card span-2 reveal">
            <h2>Nossa Missão</h2>
            <p>Impactar através da arte digital e análise de dados estratégica.</p>
        </div>

        <div class="card span-2 reveal">
            <h2>Quem Somos</h2>
            <p>Diretamente de MS, cuidamos da essência da sua marca.</p>
        </div>

        <div id="portfolio" class="card span-4 reveal" style="text-align: center;">
            <h2>Diferencial Interativo</h2>
            <p>Clique abaixo e veja o poder da nossa arte.</p>
            <button class="particle-btn" onclick="celebrate()">Ver Portfólio 🚀</button>
        </div>

        <div class="card span-4 team reveal">
            <div style="display: flex; justify-content: space-around; text-align: center;">
                <div><img src="samuel.png"><h3>Samuel Ortiz</h3><p>Head de Dados</p></div>
                <div><img src="elizangela.png"><h3>Elizangela Souza</h3><p>CEO</p></div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</body>
</html>
