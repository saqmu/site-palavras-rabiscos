<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palavras & Rabiscos | Arte Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Ícones -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>

    <div class="background-blobs"></div>

    <div class="bento-container">
        
        <!-- HEADER / LOGO -->
        <header class="item header-block">
            <div class="nav-links">Sobre • Galeria • Contato</div>
            <img src="logo.png" alt="Palavras e Rabiscos" class="logo">
            <h1 class="gradient-text">Arte Digital com Alma</h1>
        </header>

        <!-- INTERAÇÃO (ROXO/AZUL) -->
        <div class="item info-block">
            <h3>Espalhe o Amor</h3>
            <p>Se conecte com a nossa criatividade!</p>
            <button id="likeBtn" class="heart-btn">
                <span class="icon">❤️</span> <span id="likeCount">0</span>
            </button>
        </div>

        <!-- MENSAGEM (ROSA) -->
        <div class="item message-block">
            <h2>Transformamos rabiscos em palavras e arte.</h2>
            <p>Design exclusivo para marcas autênticas.</p>
        </header>

        <!-- GALERIA (LARANJA) -->
        <div class="item feature-block">
            <h3>Galeria de Estilos</h3>
            <div class="gallery-mini">
                <div class="mini-art art-1"></div>
                <div class="mini-art art-2"></div>
                <div class="mini-art art-3"></div>
            </div>
        </div>

        <!-- CONTATO / REDES -->
        <div class="item social-block">
            <h3>Nossas Redes</h3>
            <div class="social-icons">
               <button class="social-btn">Instagram</button>
               <button class="social-btn">WhatsApp</button>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
