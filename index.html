<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palavras & Rabiscos | Arte Digital</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="assets/logo.png" alt="Logo Palavras e Rabiscos" class="logo">
    </header>

    <main class="gallery">
        <!-- Exemplo de uma arte para curtir -->
        <div class="card">
            <div class="art-placeholder">Arte Digital 01</div>
            <div class="interactions">
                <button class="like-btn" onclick="curtir(this)">❤️ <span class="count">0</span></button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
